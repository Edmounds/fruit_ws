<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Waypoint Editor</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
      font-size: 15px;
      --bg: #eef1f3;
      --surface: #ffffff;
      --line: #cfd5d9;
      --text: #182025;
      --muted: #5d6970;
      --accent: #087f5b;
      --accent-hover: #066748;
      --danger: #c43d32;
      --warning: #b26a00;
      --canvas: #1c2225;
      --waypoint: #19b5d1;
      --goal: #3ab66f;
      --route: #f5c542;
    }

    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { background: var(--bg); color: var(--text); }
    button, input, select { font: inherit; letter-spacing: 0; }
    button, select, input { min-height: 38px; }
    button {
      border: 1px solid var(--line);
      border-radius: 5px;
      background: var(--surface);
      color: var(--text);
      cursor: pointer;
      padding: 7px 11px;
    }
    button:hover:not(:disabled) { background: #f4f6f7; }
    button:focus-visible, input:focus-visible, select:focus-visible {
      outline: 3px solid rgba(8, 127, 91, 0.24);
      outline-offset: 1px;
    }
    button:disabled { cursor: not-allowed; opacity: 0.48; }
    .icon-button { min-width: 38px; padding: 6px; font-size: 18px; line-height: 1; }
    .primary { border-color: var(--accent); background: var(--accent); color: #fff; }
    .primary:hover:not(:disabled) { background: var(--accent-hover); }
    .danger { color: var(--danger); }

    .app {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      width: 100%;
      height: 100%;
    }
    .topbar {
      display: grid;
      grid-template-columns: auto minmax(260px, 560px) auto auto auto;
      align-items: center;
      gap: 8px;
      min-height: 58px;
      padding: 9px 12px;
      background: var(--surface);
      border-bottom: 1px solid var(--line);
      z-index: 3;
    }
    .brand { margin: 0 14px 0 0; font-size: 18px; font-weight: 700; white-space: nowrap; }
    .file-select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 5px;
      background: #fff;
      padding: 7px 32px 7px 10px;
      color: var(--text);
    }
    .dirty-badge {
      min-width: 68px;
      color: var(--warning);
      font-size: 13px;
      font-weight: 700;
      text-align: center;
    }

    .workspace {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(470px, 500px);
      min-height: 0;
    }
    .map-pane {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      min-width: 0;
      min-height: 0;
      background: var(--canvas);
      border-right: 1px solid #111;
    }
    .map-toolbar {
      display: flex;
      align-items: center;
      gap: 6px;
      min-height: 48px;
      padding: 6px 10px;
      color: #edf1f2;
      background: #292f32;
      border-bottom: 1px solid #3d4447;
    }
    .map-toolbar button { background: #353c3f; border-color: #50585c; color: #fff; }
    .map-toolbar button:hover:not(:disabled) { background: #424a4e; }
    .map-name {
      min-width: 0;
      margin-left: 8px;
      color: #cbd2d5;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .canvas-wrap { position: relative; min-width: 0; min-height: 0; overflow: hidden; }
    #mapCanvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: none;
      cursor: grab;
    }
    #mapCanvas.dragging { cursor: grabbing; }
    .view-badge {
      position: absolute;
      top: 10px;
      left: 10px;
      max-width: calc(100% - 20px);
      padding: 6px 9px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 4px;
      color: #fff;
      background: rgba(20, 25, 27, 0.82);
      font-size: 13px;
      pointer-events: none;
    }
    .view-badge:empty { display: none; }
    .statusbar {
      min-height: 30px;
      padding: 6px 10px;
      color: #d5dcdf;
      background: #292f32;
      border-top: 1px solid #3d4447;
      font-size: 13px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .sidebar {
      display: grid;
      grid-template-rows: minmax(230px, 1fr) auto;
      min-width: 0;
      min-height: 0;
      background: var(--surface);
    }
    .point-section { display: grid; grid-template-rows: auto minmax(0, 1fr); min-height: 0; }
    .section-header {
      display: flex;
      align-items: center;
      gap: 7px;
      min-height: 48px;
      padding: 7px 10px;
      border-bottom: 1px solid var(--line);
    }
    .section-title { margin: 0 auto 0 0; font-size: 15px; }
    .point-count { color: var(--muted); font-size: 13px; font-weight: 400; }
    .table-wrap { min-height: 0; overflow: auto; }
    table { width: 100%; min-width: 470px; border-collapse: collapse; table-layout: fixed; }
    th, td {
      height: 38px;
      padding: 7px 6px;
      border-bottom: 1px solid #e4e8ea;
      text-align: right;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    th {
      position: sticky;
      top: 0;
      z-index: 1;
      color: var(--muted);
      background: #f3f5f6;
      font-size: 12px;
      font-weight: 700;
    }
    th:nth-child(1), td:nth-child(1) { width: 38px; text-align: center; }
    th:nth-child(2), td:nth-child(2) { width: 30%; text-align: left; }
    th:nth-child(3), td:nth-child(3) { width: 72px; text-align: left; }
    th:nth-child(4), td:nth-child(4), th:nth-child(5), td:nth-child(5) { width: 68px; }
    th:nth-child(6), td:nth-child(6) { width: 62px; }
    tbody tr { cursor: pointer; }
    tbody tr:hover { background: #f2f8f5; }
    tbody tr.selected { background: #dff2ea; box-shadow: inset 3px 0 var(--accent); }
    tbody tr.missing { color: #8a959b; background: #f4f6f7; }
    tbody tr.missing:hover { background: #e9edef; }
    tbody tr.missing.selected { background: #e1e6e8; box-shadow: inset 3px 0 #879297; }
    .empty-row { color: var(--muted); text-align: center !important; }

    .editor-section { border-top: 1px solid var(--line); padding: 11px 12px 13px; }
    .editor-title { margin: 0 0 10px; font-size: 15px; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 9px 10px; }
    .field { display: grid; gap: 4px; min-width: 0; }
    .field.wide { grid-column: 1 / -1; }
    .field label { color: var(--muted); font-size: 12px; font-weight: 700; }
    .field input, .field select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 5px;
      background: #fff;
      color: var(--text);
      padding: 7px 9px;
    }
    .field input[aria-invalid="true"] { border-color: var(--danger); background: #fff6f5; }
    .form-error { min-height: 20px; margin-top: 7px; color: var(--danger); font-size: 13px; }
    .form-error.preview { color: var(--muted); }
    .editor-disabled { opacity: 0.55; pointer-events: none; }
    .toast {
      position: fixed;
      right: 16px;
      bottom: 16px;
      z-index: 10;
      max-width: min(520px, calc(100vw - 32px));
      padding: 10px 13px;
      border-radius: 5px;
      color: #fff;
      background: #263238;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.24);
      opacity: 0;
      transform: translateY(8px);
      transition: opacity 140ms ease, transform 140ms ease;
      pointer-events: none;
    }
    .toast.visible { opacity: 1; transform: translateY(0); }

    @media (max-width: 900px) {
      html, body { overflow: auto; }
      .app { height: auto; min-height: 100%; grid-template-rows: auto auto; }
      .topbar { grid-template-columns: 1fr auto auto; }
      .brand { grid-column: 1 / -1; margin: 0; }
      .file-select { grid-column: 1 / -1; }
      .dirty-badge { grid-column: 1; grid-row: 3; text-align: left; }
      .workspace { grid-template-columns: 1fr; grid-template-rows: minmax(430px, 58vh) auto; }
      .map-pane { border-right: 0; border-bottom: 1px solid #111; }
      .sidebar { grid-template-rows: minmax(280px, 42vh) auto; }
      .editor-section { padding-bottom: max(16px, env(safe-area-inset-bottom)); }
    }

    @media (max-width: 520px) {
      .topbar { padding: 8px; }
      .brand { font-size: 17px; }
      .map-toolbar { padding-inline: 7px; }
      .map-name { display: none; }
      .workspace { grid-template-rows: minmax(390px, 55vh) auto; }
      .sidebar { grid-template-rows: minmax(260px, 42vh) auto; }
      .form-grid { grid-template-columns: 1fr 1fr; }
      th, td { padding-inline: 4px; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <h1 class="brand">Waypoint Editor</h1>
      <select id="fileSelect" class="file-select" aria-label="Waypoint 文件"></select>
      <span id="dirtyBadge" class="dirty-badge"></span>
      <button id="reloadButton" type="button" title="重新加载当前 YAML">重新加载</button>
      <button id="saveButton" class="primary" type="button" title="备份并保存当前 YAML">保存</button>
    </header>

    <main class="workspace">
      <section class="map-pane" aria-label="路线视图">
        <div class="map-toolbar">
          <button id="fitButton" type="button" title="适应全部内容">适应</button>
          <button id="actualButton" type="button" title="网格 80 像素/米">100%</button>
          <button id="zoomOutButton" class="icon-button" type="button" title="缩小">−</button>
          <button id="zoomInButton" class="icon-button" type="button" title="放大">+</button>
          <span id="mapName" class="map-name"></span>
        </div>
        <div class="canvas-wrap">
          <canvas id="mapCanvas"></canvas>
          <div id="viewBadge" class="view-badge"></div>
        </div>
        <div id="statusBar" class="statusbar">正在连接 waypoint editor 服务…</div>
      </section>

      <aside class="sidebar">
        <section class="point-section" aria-label="点位列表">
          <div class="section-header">
            <h2 class="section-title">点位 <span id="pointCount" class="point-count">0</span></h2>
            <button id="addButton" class="icon-button" type="button" title="补充选中的缺失点">+</button>
            <button id="deleteButton" class="icon-button danger" type="button" title="删除选中点">×</button>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr><th>#</th><th>名称</th><th>类型</th><th>X</th><th>Y</th><th>Yaw°</th></tr>
              </thead>
              <tbody id="pointTable"></tbody>
            </table>
          </div>
        </section>

        <section id="editorSection" class="editor-section editor-disabled" aria-label="选中点编辑">
          <h2 class="editor-title">选中点</h2>
          <div class="form-grid">
            <div class="field wide">
              <label for="pointName">名称</label>
              <input id="pointName" maxlength="200" autocomplete="off" readonly>
            </div>
            <div class="field wide">
              <label for="pointType">类型</label>
              <select id="pointType"><option value="waypoint">waypoint</option><option value="goal">goal</option></select>
            </div>
            <div class="field">
              <label for="pointX">X (m)</label>
              <input id="pointX" inputmode="decimal" autocomplete="off">
            </div>
            <div class="field">
              <label for="pointY">Y (m)</label>
              <input id="pointY" inputmode="decimal" autocomplete="off">
            </div>
            <div class="field wide">
              <label for="pointYaw">Yaw (°)</label>
              <input id="pointYaw" inputmode="decimal" autocomplete="off">
            </div>
          </div>
          <div id="formError" class="form-error" role="status"></div>
        </section>
      </aside>
    </main>
  </div>
  <div id="toast" class="toast" role="status"></div>

  <script>
    "use strict";

    const elements = {
      fileSelect: document.getElementById("fileSelect"),
      dirtyBadge: document.getElementById("dirtyBadge"),
      reloadButton: document.getElementById("reloadButton"),
      saveButton: document.getElementById("saveButton"),
      fitButton: document.getElementById("fitButton"),
      actualButton: document.getElementById("actualButton"),
      zoomOutButton: document.getElementById("zoomOutButton"),
      zoomInButton: document.getElementById("zoomInButton"),
      mapName: document.getElementById("mapName"),
      canvas: document.getElementById("mapCanvas"),
      viewBadge: document.getElementById("viewBadge"),
      statusBar: document.getElementById("statusBar"),
      pointCount: document.getElementById("pointCount"),
      pointTable: document.getElementById("pointTable"),
      addButton: document.getElementById("addButton"),
      deleteButton: document.getElementById("deleteButton"),
      editorSection: document.getElementById("editorSection"),
      pointName: document.getElementById("pointName"),
      pointType: document.getElementById("pointType"),
      pointX: document.getElementById("pointX"),
      pointY: document.getElementById("pointY"),
      pointYaw: document.getElementById("pointYaw"),
      formError: document.getElementById("formError"),
      toast: document.getElementById("toast")
    };

    const context = elements.canvas.getContext("2d");
    const state = {
      files: [],
      currentId: "",
      document: null,
      points: [],
      template: [],
      selectedIndex: -1,
      dirty: false,
      loading: false,
      formInvalid: false,
      scale: 1,
      offsetX: 0,
      offsetY: 0,
      viewInitialized: false,
      gridBounds: { minX: -2, maxX: 2, minY: -2, maxY: 2 },
      drag: null,
      pointers: new Map(),
      pinch: null,
      cursorWorld: null,
      toastTimer: null
    };

    function setLoading(value) {
      state.loading = value;
      elements.fileSelect.disabled = value;
      elements.reloadButton.disabled = value || !state.currentId;
      updateActionState();
    }

    function setDirty(value) {
      state.dirty = value;
      elements.dirtyBadge.textContent = value ? "未保存" : "";
      updateActionState();
    }

    function updateActionState() {
      elements.saveButton.disabled = state.loading || !state.dirty || state.formInvalid || !state.currentId;
      elements.deleteButton.disabled = state.loading || selectedActualIndex() < 0;
      elements.addButton.disabled = state.loading || !displayPoints().some(point => point.missing);
    }

    function setStatus(message) {
      const modified = state.dirty ? " | 未保存" : "";
      elements.statusBar.textContent = `${message}${modified}`;
    }

    function showToast(message) {
      elements.toast.textContent = message;
      elements.toast.classList.add("visible");
      window.clearTimeout(state.toastTimer);
      state.toastTimer = window.setTimeout(() => elements.toast.classList.remove("visible"), 3200);
    }

    async function requestJson(url, options) {
      const response = await fetch(url, options);
      const payload = await response.json().catch(() => ({ error: `HTTP ${response.status}` }));
      if (!response.ok) throw new Error(payload.error || `HTTP ${response.status}`);
      return payload;
    }

    function actualIndexByName(name) {
      return state.points.findIndex(point => point.name === name);
    }

    function selectedActualIndex() {
      const templatePoint = state.template[state.selectedIndex];
      return templatePoint ? actualIndexByName(templatePoint.name) : -1;
    }

    function displayPoints() {
      if (!state.template.length) return [];
      const anchorIndex = actualIndexByName("A1");
      const anchor = anchorIndex >= 0 ? state.points[anchorIndex] : { x: 0, y: 0, z: 0 };
      return state.template.map((templatePoint, templateIndex) => {
        const actualIndex = actualIndexByName(templatePoint.name);
        if (actualIndex >= 0) {
          return { ...state.points[actualIndex], actualIndex, templateIndex, missing: false };
        }
        return {
          name: templatePoint.name,
          type: templatePoint.type,
          x: anchor.x + templatePoint.dx,
          y: anchor.y + templatePoint.dy,
          z: anchor.z + templatePoint.dz,
          yaw_deg: templatePoint.yaw_deg,
          extra: {},
          actualIndex: -1,
          templateIndex,
          missing: true
        };
      });
    }

    function sortActualPoints() {
      const order = new Map(state.template.map((point, index) => [point.name, index]));
      state.points.sort((first, second) => order.get(first.name) - order.get(second.name));
    }

    async function loadFiles() {
      setLoading(true);
      try {
        const payload = await requestJson("/api/files");
        state.files = payload.files;
        elements.fileSelect.replaceChildren();
        for (const file of state.files) {
          const option = document.createElement("option");
          option.value = file.id;
          option.textContent = file.label;
          option.disabled = !file.file_available;
          elements.fileSelect.append(option);
        }
        const firstAvailable = state.files.find(file => file.file_available);
        if (!firstAvailable) throw new Error("没有可加载的 waypoint YAML");
        await loadDocument(firstAvailable.id);
      } catch (error) {
        setStatus(`加载失败: ${error.message}`);
        showToast(`加载失败: ${error.message}`);
      } finally {
        setLoading(false);
      }
    }

    async function loadDocument(fileId) {
      setLoading(true);
      try {
        const payload = await requestJson(`/api/document?id=${encodeURIComponent(fileId)}`);
        state.currentId = fileId;
        state.document = payload;
        state.points = payload.points;
        state.template = payload.template;
        state.selectedIndex = state.template.length ? 0 : -1;
        state.viewInitialized = false;
        elements.fileSelect.value = fileId;
        elements.mapName.textContent = `${payload.label} | ${payload.frame_id}`;
        updateGridBounds();
        fitView();
        setDirty(false);
        renderAll();
        setStatus(`已加载 ${payload.label}，${state.points.length} 个点`);
      } catch (error) {
        setStatus(`加载失败: ${error.message}`);
        showToast(`加载失败: ${error.message}`);
        throw error;
      } finally {
        setLoading(false);
      }
    }

    function updateGridBounds() {
      const visiblePoints = displayPoints();
      const xs = [0, ...visiblePoints.map(point => point.x)];
      const ys = [0, ...visiblePoints.map(point => point.y)];
      let minX = Math.min(...xs);
      let maxX = Math.max(...xs);
      let minY = Math.min(...ys);
      let maxY = Math.max(...ys);
      const spanX = Math.max(4, maxX - minX);
      const spanY = Math.max(4, maxY - minY);
      const margin = Math.max(1, Math.max(spanX, spanY) * 0.12);
      const centerX = (minX + maxX) / 2;
      const centerY = (minY + maxY) / 2;
      minX = centerX - spanX / 2 - margin;
      maxX = centerX + spanX / 2 + margin;
      minY = centerY - spanY / 2 - margin;
      maxY = centerY + spanY / 2 + margin;
      state.gridBounds = { minX, maxX, minY, maxY };
    }

    function logicalBounds() {
      const bounds = state.gridBounds;
      return { minX: bounds.minX, maxX: bounds.maxX, minY: -bounds.maxY, maxY: -bounds.minY };
    }

    function fitView() {
      if (!state.document) return;
      updateGridBounds();
      const bounds = logicalBounds();
      const width = Math.max(1, elements.canvas.clientWidth);
      const height = Math.max(1, elements.canvas.clientHeight);
      const margin = 28;
      state.scale = Math.max(0.02, Math.min(
        (width - margin * 2) / Math.max(0.001, bounds.maxX - bounds.minX),
        (height - margin * 2) / Math.max(0.001, bounds.maxY - bounds.minY)
      ));
      state.offsetX = (width - (bounds.minX + bounds.maxX) * state.scale) / 2;
      state.offsetY = (height - (bounds.minY + bounds.maxY) * state.scale) / 2;
      state.viewInitialized = true;
      draw();
    }

    function actualView() {
      if (!state.document) return;
      const centerX = elements.canvas.clientWidth / 2;
      const centerY = elements.canvas.clientHeight / 2;
      const logical = screenToLogical(centerX, centerY);
      state.scale = 80;
      state.offsetX = centerX - logical.x * state.scale;
      state.offsetY = centerY - logical.y * state.scale;
      state.viewInitialized = true;
      draw();
    }

    function zoomAt(factor, screenX, screenY) {
      const logical = screenToLogical(screenX, screenY);
      state.scale = Math.min(1000, Math.max(0.02, state.scale * factor));
      state.offsetX = screenX - logical.x * state.scale;
      state.offsetY = screenY - logical.y * state.scale;
      draw();
    }

    function mapToLogical(x, y) {
      return { x, y: -y };
    }

    function logicalToMap(logicalX, logicalY) {
      return { x: logicalX, y: -logicalY };
    }

    function logicalToScreen(logicalX, logicalY) {
      return { x: state.offsetX + logicalX * state.scale, y: state.offsetY + logicalY * state.scale };
    }

    function screenToLogical(screenX, screenY) {
      return { x: (screenX - state.offsetX) / state.scale, y: (screenY - state.offsetY) / state.scale };
    }

    function pointToScreen(point) {
      const logical = mapToLogical(point.x, point.y);
      return logicalToScreen(logical.x, logical.y);
    }

    function chooseGridStep() {
      const desiredMeters = 80 / Math.max(state.scale, 0.001);
      const exponent = Math.floor(Math.log10(desiredMeters));
      const base = 10 ** exponent;
      const ratio = desiredMeters / base;
      return (ratio < 2 ? 2 : ratio < 5 ? 5 : 10) * base;
    }

    function drawGrid(width, height) {
      const step = chooseGridStep();
      const topLeft = logicalToMap(...Object.values(screenToLogical(0, 0)));
      const bottomRight = logicalToMap(...Object.values(screenToLogical(width, height)));
      const minX = Math.min(topLeft.x, bottomRight.x);
      const maxX = Math.max(topLeft.x, bottomRight.x);
      const minY = Math.min(topLeft.y, bottomRight.y);
      const maxY = Math.max(topLeft.y, bottomRight.y);
      context.lineWidth = 1;
      context.strokeStyle = "#394247";
      context.fillStyle = "#9aa6ab";
      context.font = "11px sans-serif";
      context.textAlign = "left";
      context.textBaseline = "top";
      for (let x = Math.floor(minX / step) * step; x <= maxX; x += step) {
        const from = logicalToScreen(x, -minY);
        const to = logicalToScreen(x, -maxY);
        context.beginPath(); context.moveTo(from.x, from.y); context.lineTo(to.x, to.y); context.stroke();
        context.fillText(`${formatCompact(x)} m`, from.x + 4, 5);
      }
      for (let y = Math.floor(minY / step) * step; y <= maxY; y += step) {
        const from = logicalToScreen(minX, -y);
        const to = logicalToScreen(maxX, -y);
        context.beginPath(); context.moveTo(from.x, from.y); context.lineTo(to.x, to.y); context.stroke();
        context.fillText(`${formatCompact(y)} m`, 5, from.y + 3);
      }
    }

    function drawOrigin() {
      const point = pointToScreen({ x: 0, y: 0 });
      context.strokeStyle = "#ef554b";
      context.lineWidth = 2;
      context.beginPath();
      context.moveTo(point.x - 9, point.y); context.lineTo(point.x + 9, point.y);
      context.moveTo(point.x, point.y - 9); context.lineTo(point.x, point.y + 9);
      context.stroke();
      context.fillStyle = "#ff8178";
      context.font = "bold 12px sans-serif";
      context.textAlign = "left";
      context.textBaseline = "top";
      context.fillText("origin", point.x + 8, point.y + 8);
    }

    function drawRoute() {
      const visiblePoints = displayPoints();
      if (visiblePoints.length < 2) return;
      context.save();
      context.setLineDash([6, 6]);
      context.strokeStyle = "rgba(195, 204, 208, 0.45)";
      context.lineWidth = 2;
      context.beginPath();
      visiblePoints.forEach((point, index) => {
        const screen = pointToScreen(point);
        if (index === 0) context.moveTo(screen.x, screen.y); else context.lineTo(screen.x, screen.y);
      });
      context.stroke();
      context.restore();

      const actualPoints = visiblePoints.filter(point => !point.missing);
      if (actualPoints.length < 2) return;
      context.strokeStyle = "#f5c542";
      context.lineWidth = 2;
      context.beginPath();
      actualPoints.forEach((point, index) => {
        const screen = pointToScreen(point);
        if (index === 0) context.moveTo(screen.x, screen.y); else context.lineTo(screen.x, screen.y);
      });
      context.stroke();
    }

    function pointLabelBox(point, index) {
      const screen = pointToScreen(point);
      const label = `${index + 1}: ${point.name}${point.missing ? " [缺失]" : ""}`;
      context.font = index === state.selectedIndex ? "bold 12px sans-serif" : "12px sans-serif";
      const width = context.measureText(label).width;
      return {
        label,
        left: screen.x + 8,
        right: screen.x + 15 + width,
        top: screen.y - 25,
        bottom: screen.y - 6
      };
    }

    function boxesOverlap(first, second) {
      return first.left < second.right && first.right > second.left && first.top < second.bottom && first.bottom > second.top;
    }

    function drawPoint(point, index, labelBoxes) {
      const screen = pointToScreen(point);
      const selected = index === state.selectedIndex;
      const color = point.missing ? "#929da2" : point.type === "goal" ? "#3ab66f" : "#19b5d1";
      const radius = selected ? 9 : 7;
      context.save();
      context.globalAlpha = point.missing ? 0.58 : 1;
      context.beginPath();
      context.arc(screen.x, screen.y, radius, 0, Math.PI * 2);
      context.fillStyle = color;
      context.fill();
      context.strokeStyle = selected ? "#ffffff" : "#111719";
      context.lineWidth = selected ? 3 : 1;
      context.stroke();

      const yaw = point.yaw_deg * Math.PI / 180;
      const length = selected ? 34 : 25;
      const end = { x: screen.x + Math.cos(yaw) * length, y: screen.y - Math.sin(yaw) * length };
      context.strokeStyle = color;
      context.fillStyle = color;
      context.lineWidth = selected ? 3 : 2;
      context.beginPath(); context.moveTo(screen.x, screen.y); context.lineTo(end.x, end.y); context.stroke();
      const angle = Math.atan2(end.y - screen.y, end.x - screen.x);
      context.beginPath();
      context.moveTo(end.x, end.y);
      context.lineTo(end.x - 10 * Math.cos(angle - 0.45), end.y - 10 * Math.sin(angle - 0.45));
      context.lineTo(end.x - 10 * Math.cos(angle + 0.45), end.y - 10 * Math.sin(angle + 0.45));
      context.closePath(); context.fill();
      if (selected && !point.missing) {
        context.beginPath(); context.arc(end.x, end.y, 7, 0, Math.PI * 2);
        context.fillStyle = "#fff"; context.fill();
        context.strokeStyle = color; context.lineWidth = 3; context.stroke();
      }

      const labelBox = pointLabelBox(point, index);
      if (selected || !labelBoxes.some(box => boxesOverlap(box, labelBox))) {
        if (!selected) labelBoxes.push(labelBox);
        context.font = selected ? "bold 12px sans-serif" : "12px sans-serif";
        context.textAlign = "left";
        context.textBaseline = "bottom";
        context.lineWidth = 3;
        context.strokeStyle = "rgba(20, 25, 27, 0.9)";
        context.strokeText(labelBox.label, screen.x + 11, screen.y - 9);
        context.fillStyle = "#fff";
        context.fillText(labelBox.label, screen.x + 11, screen.y - 9);
      }
      context.restore();
    }

    function draw() {
      const width = elements.canvas.clientWidth;
      const height = elements.canvas.clientHeight;
      context.clearRect(0, 0, width, height);
      context.fillStyle = "#1c2225";
      context.fillRect(0, 0, width, height);
      if (!state.document || !state.viewInitialized) return;
      drawGrid(width, height);
      drawOrigin();
      drawRoute();
      const points = displayPoints();
      const selected = points[state.selectedIndex];
      const labelBoxes = selected ? [pointLabelBox(selected, state.selectedIndex)] : [];
      points.forEach((point, index) => {
        if (index !== state.selectedIndex) drawPoint(point, index, labelBoxes);
      });
      if (selected) drawPoint(selected, state.selectedIndex, labelBoxes);
    }

    function resizeCanvas() {
      const ratio = window.devicePixelRatio || 1;
      const width = Math.max(1, elements.canvas.clientWidth);
      const height = Math.max(1, elements.canvas.clientHeight);
      elements.canvas.width = Math.round(width * ratio);
      elements.canvas.height = Math.round(height * ratio);
      context.setTransform(ratio, 0, 0, ratio, 0, 0);
      if (state.viewInitialized) draw();
    }

    function renderAll() {
      renderTable();
      renderForm();
      const map = state.document ? state.document.map : null;
      elements.viewBadge.textContent = !map ? "" : map.available ? "" : map.reason;
      elements.pointCount.textContent = `${state.points.length}/${state.template.length}`;
      updateActionState();
      draw();
    }

    function renderTable() {
      elements.pointTable.replaceChildren();
      const points = displayPoints();
      if (!points.length) {
        const row = document.createElement("tr");
        const cell = document.createElement("td");
        cell.colSpan = 6;
        cell.className = "empty-row";
        cell.textContent = "template 没有点位";
        row.append(cell);
        elements.pointTable.append(row);
        return;
      }
      points.forEach((point, index) => {
        const row = document.createElement("tr");
        if (index === state.selectedIndex) row.classList.add("selected");
        if (point.missing) row.classList.add("missing");
        row.addEventListener("click", () => selectPoint(index));
        const values = [index + 1, point.name, point.type, point.x.toFixed(3), point.y.toFixed(3), point.yaw_deg.toFixed(1)];
        for (const value of values) {
          const cell = document.createElement("td");
          cell.textContent = String(value);
          cell.title = String(value);
          row.append(cell);
        }
        elements.pointTable.append(row);
      });
    }

    function formatInput(value) {
      return Number(value).toPrecision(10).replace(/(?:\.0+|(?:(\.\d*?[1-9])0+))$/, "$1");
    }

    function formatAngle(value) {
      return String(Number(Number(value).toFixed(3)));
    }

    function renderForm() {
      const point = displayPoints()[state.selectedIndex];
      const editable = point && !point.missing;
      elements.editorSection.classList.toggle("editor-disabled", !editable);
      if (!point) {
        elements.pointName.value = "";
        elements.pointType.value = "waypoint";
        elements.pointX.value = "";
        elements.pointY.value = "";
        elements.pointYaw.value = "";
        elements.formError.textContent = "";
        elements.formError.classList.remove("preview");
        state.formInvalid = false;
        return;
      }
      elements.pointName.value = point.name;
      elements.pointType.value = point.type;
      elements.pointX.value = formatInput(point.x);
      elements.pointY.value = formatInput(point.y);
      elements.pointYaw.value = formatAngle(point.yaw_deg);
      if (point.missing) {
        state.formInvalid = false;
        elements.formError.classList.add("preview");
        elements.formError.textContent = "缺失点预览，点击 + 按当前预览坐标补充";
        updateActionState();
      } else {
        validateForm();
      }
    }

    function selectPoint(index) {
      if (index < 0 || index >= state.template.length) return;
      state.selectedIndex = index;
      renderTable();
      renderForm();
      draw();
    }

    function parseFiniteInput(input, label) {
      const value = Number(input.value.trim());
      const valid = input.value.trim() !== "" && Number.isFinite(value);
      input.setAttribute("aria-invalid", valid ? "false" : "true");
      if (!valid) throw new Error(`${label} 必须是有限数值`);
      return value;
    }

    function validateAllPoints() {
      const templateNames = new Set(state.template.map(point => point.name));
      const names = new Set();
      for (const point of state.points) {
        const name = point.name.trim();
        if (!name) return "点名称不能为空";
        if (!templateNames.has(name)) return `点名称不在 template 中: ${name}`;
        if (names.has(name)) return `点名称重复: ${name}`;
        if (!["waypoint", "goal"].includes(point.type)) return `点 ${name} 的类型无效`;
        if (!Number.isFinite(point.x) || !Number.isFinite(point.y) || !Number.isFinite(point.z) || !Number.isFinite(point.yaw_deg)) return `点 ${name} 的坐标无效`;
        names.add(name);
      }
      return "";
    }

    function validateForm() {
      const point = state.points[selectedActualIndex()];
      elements.formError.classList.remove("preview");
      if (!point) {
        state.formInvalid = false;
        elements.formError.textContent = "";
        updateActionState();
        return false;
      }
      try {
        if (!elements.pointName.value.trim()) throw new Error("点名称不能为空");
        parseFiniteInput(elements.pointX, "X");
        parseFiniteInput(elements.pointY, "Y");
        parseFiniteInput(elements.pointYaw, "Yaw");
        const pointError = validateAllPoints();
        if (pointError) throw new Error(pointError);
        state.formInvalid = false;
        elements.formError.textContent = "";
      } catch (error) {
        state.formInvalid = true;
        elements.formError.textContent = error.message;
      }
      updateActionState();
      return !state.formInvalid;
    }

    function applyFormInput(event) {
      const point = state.points[selectedActualIndex()];
      if (!point) return;
      try {
        if (event.target === elements.pointType) point.type = elements.pointType.value;
        if (event.target === elements.pointX) point.x = parseFiniteInput(elements.pointX, "X");
        if (event.target === elements.pointY) point.y = parseFiniteInput(elements.pointY, "Y");
        if (event.target === elements.pointYaw) point.yaw_deg = parseFiniteInput(elements.pointYaw, "Yaw");
      } catch (_error) {
        validateForm();
        return;
      }
      setDirty(true);
      validateForm();
      renderTable();
      draw();
    }

    function addPoint() {
      const points = displayPoints();
      let templateIndex = state.selectedIndex;
      if (!points[templateIndex] || !points[templateIndex].missing) {
        templateIndex = points.findIndex((point, index) => index > state.selectedIndex && point.missing);
        if (templateIndex < 0) templateIndex = points.findIndex(point => point.missing);
      }
      const preview = points[templateIndex];
      if (!preview || !preview.missing) return;
      state.points.push({
        name: preview.name,
        type: preview.type,
        x: preview.x,
        y: preview.y,
        z: preview.z,
        yaw_deg: preview.yaw_deg,
        extra: {}
      });
      sortActualPoints();
      state.selectedIndex = templateIndex;
      updateGridBounds();
      setDirty(true);
      renderAll();
      elements.pointX.focus();
      elements.pointX.select();
      setStatus(`已补充 ${preview.name}`);
    }

    function deletePoint() {
      const actualIndex = selectedActualIndex();
      const point = state.points[actualIndex];
      if (!point) return;
      if (!window.confirm(`删除点“${point.name}”？`)) return;
      state.points.splice(actualIndex, 1);
      updateGridBounds();
      setDirty(true);
      renderAll();
      setStatus(`已删除 ${point.name}`);
    }

    async function saveDocument() {
      if (selectedActualIndex() >= 0 && !validateForm()) return;
      const pointError = validateAllPoints();
      if (pointError) {
        state.formInvalid = true;
        elements.formError.textContent = pointError;
        updateActionState();
        return;
      }
      setLoading(true);
      try {
        const result = await requestJson("/api/document", {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ id: state.currentId, points: state.points })
        });
        setDirty(false);
        await loadDocument(state.currentId);
        showToast(`已保存，备份: ${result.backup}`);
      } catch (error) {
        setStatus(`保存失败: ${error.message}`);
        showToast(`保存失败: ${error.message}`);
      } finally {
        setLoading(false);
      }
    }

    function confirmDiscard() {
      return !state.dirty || window.confirm("当前修改尚未保存，确定放弃吗？");
    }

    function nearestPoint(screenX, screenY) {
      let best = -1;
      let distance = 18;
      displayPoints().forEach((point, index) => {
        const screen = pointToScreen(point);
        const current = Math.hypot(screenX - screen.x, screenY - screen.y);
        if (current < distance) { distance = current; best = index; }
      });
      return best;
    }

    function selectedYawHandle() {
      const point = state.points[selectedActualIndex()];
      if (!point) return null;
      const screen = pointToScreen(point);
      const yaw = point.yaw_deg * Math.PI / 180;
      return { x: screen.x + Math.cos(yaw) * 34, y: screen.y - Math.sin(yaw) * 34 };
    }

    function eventPosition(event) {
      const rect = elements.canvas.getBoundingClientRect();
      return { x: event.clientX - rect.left, y: event.clientY - rect.top };
    }

    function startPinch() {
      if (state.pointers.size !== 2) return;
      const points = [...state.pointers.values()];
      const center = { x: (points[0].x + points[1].x) / 2, y: (points[0].y + points[1].y) / 2 };
      state.pinch = {
        distance: Math.hypot(points[0].x - points[1].x, points[0].y - points[1].y),
        scale: state.scale,
        logical: screenToLogical(center.x, center.y)
      };
      state.drag = null;
    }

    function onPointerDown(event) {
      if (!state.document) return;
      const position = eventPosition(event);
      state.pointers.set(event.pointerId, position);
      elements.canvas.setPointerCapture(event.pointerId);
      if (state.pointers.size === 2) { startPinch(); return; }

      const handle = selectedYawHandle();
      if (handle && Math.hypot(position.x - handle.x, position.y - handle.y) <= 15) {
        state.drag = { mode: "yaw", actualIndex: selectedActualIndex() };
      } else {
        const index = nearestPoint(position.x, position.y);
        if (index >= 0) {
          selectPoint(index);
          const actualIndex = selectedActualIndex();
          state.drag = actualIndex >= 0 ? { mode: "move", actualIndex } : null;
        } else {
          state.drag = { mode: "pan", x: position.x, y: position.y, offsetX: state.offsetX, offsetY: state.offsetY };
        }
      }
      elements.canvas.classList.add("dragging");
    }

    function onPointerMove(event) {
      const position = eventPosition(event);
      if (state.pointers.has(event.pointerId)) state.pointers.set(event.pointerId, position);
      if (state.pinch && state.pointers.size === 2) {
        const points = [...state.pointers.values()];
        const center = { x: (points[0].x + points[1].x) / 2, y: (points[0].y + points[1].y) / 2 };
        const distance = Math.max(1, Math.hypot(points[0].x - points[1].x, points[0].y - points[1].y));
        state.scale = Math.min(1000, Math.max(0.02, state.pinch.scale * distance / Math.max(1, state.pinch.distance)));
        state.offsetX = center.x - state.pinch.logical.x * state.scale;
        state.offsetY = center.y - state.pinch.logical.y * state.scale;
        draw();
        return;
      }
      if (state.drag) {
        const point = state.points[state.drag.actualIndex];
        if (state.drag.mode === "move" && point) {
          const logical = screenToLogical(position.x, position.y);
          const world = logicalToMap(logical.x, logical.y);
          point.x = world.x; point.y = world.y;
          setDirty(true); renderTable(); renderForm(); draw();
        } else if (state.drag.mode === "yaw" && point) {
          const screen = pointToScreen(point);
          point.yaw_deg = Math.atan2(screen.y - position.y, position.x - screen.x) * 180 / Math.PI;
          setDirty(true); renderTable(); renderForm(); draw();
        } else if (state.drag.mode === "pan") {
          state.offsetX = state.drag.offsetX + position.x - state.drag.x;
          state.offsetY = state.drag.offsetY + position.y - state.drag.y;
          draw();
        }
      } else if (state.document) {
        const logical = screenToLogical(position.x, position.y);
        state.cursorWorld = logicalToMap(logical.x, logical.y);
        setStatus(`${state.document.label} | x=${state.cursorWorld.x.toFixed(3)}, y=${state.cursorWorld.y.toFixed(3)}`);
      }
    }

    function onPointerEnd(event) {
      state.pointers.delete(event.pointerId);
      if (state.pointers.size < 2) state.pinch = null;
      if (state.pointers.size === 0) {
        state.drag = null;
        elements.canvas.classList.remove("dragging");
      }
    }

    elements.fileSelect.addEventListener("change", async event => {
      const nextId = event.target.value;
      if (!confirmDiscard()) { event.target.value = state.currentId; return; }
      try { await loadDocument(nextId); } catch (_error) { event.target.value = state.currentId; }
    });
    elements.reloadButton.addEventListener("click", () => {
      if (confirmDiscard()) loadDocument(state.currentId).catch(() => {});
    });
    elements.saveButton.addEventListener("click", saveDocument);
    elements.addButton.addEventListener("click", addPoint);
    elements.deleteButton.addEventListener("click", deletePoint);
    elements.fitButton.addEventListener("click", fitView);
    elements.actualButton.addEventListener("click", actualView);
    elements.zoomOutButton.addEventListener("click", () => zoomAt(0.8, elements.canvas.clientWidth / 2, elements.canvas.clientHeight / 2));
    elements.zoomInButton.addEventListener("click", () => zoomAt(1.25, elements.canvas.clientWidth / 2, elements.canvas.clientHeight / 2));
    [elements.pointName, elements.pointType, elements.pointX, elements.pointY, elements.pointYaw]
      .forEach(input => input.addEventListener("input", applyFormInput));
    elements.canvas.addEventListener("pointerdown", onPointerDown);
    elements.canvas.addEventListener("pointermove", onPointerMove);
    elements.canvas.addEventListener("pointerup", onPointerEnd);
    elements.canvas.addEventListener("pointercancel", onPointerEnd);
    elements.canvas.addEventListener("wheel", event => {
      event.preventDefault();
      const position = eventPosition(event);
      zoomAt(event.deltaY < 0 ? 1.12 : 0.89, position.x, position.y);
    }, { passive: false });
    window.addEventListener("beforeunload", event => {
      if (!state.dirty) return;
      event.preventDefault();
      event.returnValue = "";
    });
    window.addEventListener("keydown", event => {
      if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "s") {
        event.preventDefault();
        if (!elements.saveButton.disabled) saveDocument();
      }
      if (event.key === "Delete" && !["INPUT", "SELECT"].includes(document.activeElement.tagName)) deletePoint();
    });
    new ResizeObserver(resizeCanvas).observe(elements.canvas);

    function formatCompact(value) {
      if (Math.abs(value) < 1e-10) return "0";
      return Math.abs(value) >= 100 || Math.abs(value) < 0.01 ? value.toExponential(1) : value.toFixed(2).replace(/0+$/, "").replace(/\.$/, "");
    }

    resizeCanvas();
    loadFiles();
  </script>
</body>
</html>

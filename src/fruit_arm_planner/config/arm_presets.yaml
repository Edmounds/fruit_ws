arm_planner_node:
  ros__parameters:
    # ------------------------------------------------------------------------
    # 1. 机械臂连杆物理几何尺寸 (单位: 米)
    # ------------------------------------------------------------------------
    geometry:
      d1: 0.062       # 基座高度 (底盘安装面至肩部俯仰轴)
      a2: 0.26       # 大臂长度 (肩轴至肘轴)
      a3: 0.26       # 小臂长度 (肘轴至腕轴)
      a4: 0.12       # 腕轴沿末端局部 X 方向伸出长度；pitch=0 时此段水平
      tool_z_offset_m: -0.03  # 真实抓取点的末端局部 Z 偏移，随腕部旋转；下方为负

    # ------------------------------------------------------------------------
    # 2. 关节坐标系映射与零位偏置
    # 几何参考: 大臂竖直朝天，小臂水平朝前，腕部与小臂同向
    # 原始电机读数的零位误差由以下 offset_deg 按现场标定值修正
    # 运动方向定义: 所有关节向上抬为正 (+), 向下降为负 (-)
    # Q1/Q2/Q4: q_hardware = direction * q_algo + offset_deg
    # Q3: q_hardware = direction * (q2_algo + q3_algo) + offset_deg
    # ------------------------------------------------------------------------
    joint_mapping:
      q1:
        offset_deg: 0.0          # 偏航底座零位 (正前为0, 左正右负)
        direction: 1.0
        limits_deg: [-185.0, 185.0]
      q2:
        offset_deg: -89.0        # 几何竖直 q2=90° 时，硬件目标角为1°
        direction: 1.0
        limits_deg: [-87.0, 90.0] # -87°为接近底盘水平极限，+45°为后仰极限
      q3:
        offset_deg: -13.0         # 模型小臂水平 q2+q3=0° 时，硬件目标角为-6°
        direction: 1.0
        limits_deg: [-135.0, 90.0]
      q4:
        offset_deg: -5.0         # 模型腕部与小臂同向 q4=0° 时，硬件目标角为-5°
        direction: 1.0
        limits_deg: [-130.0, 130.0]

    # ------------------------------------------------------------------------
    # 3. 规划与插值默认参数
    # ------------------------------------------------------------------------
    planning:
      default_duration_ms: 300   # 默认点到点耗时 (ms)
      interpolation_step_ms: 200   # 约5Hz 插值周期 (ms)
      default_dwell_ms: 500       # 夹爪动作路点未写 dwell_ms 时的驻留时间 (ms)
      status_max_age_sec: 0.25    # 接受四轴实测反馈的最大接收时延 (s)
      hover_height_m: 0.06        # 安全悬停提升高度 (m)

    # ------------------------------------------------------------------------
    # 4. 机械臂预设工序与固定轨迹动作库
    # coordinate_frame:
    #   - "cartesian": target 为 [x, y, z, pitch_deg] (米, 度)，直观可测
    #   - "link_angles": target 为 [偏航, 大臂相对竖直, 小臂相对水平, 末端相对水平] (度)
    #   - "joints":      target 为四个电机原始硬件角 (度)，不应用零位偏置
    # gripper: 0=保持 (HOLD), 1=张开 (OPEN), 2=闭合 (CLOSE)
    # dwell_ms: 到达该点后原地停顿夹取时长 (双点驻留法)
    # ------------------------------------------------------------------------
    presets:
      # pick_sequence:
      #   description: "标准苹果采摘多动作工序 (以笛卡尔空间坐标定义)测试用"
      #   coordinate_frame: "cartesian"
      #   waypoints:
      #     # linear 写在每个航点内，控制上一位置到该目标的运动段；true=LIN，false/省略=PTP
      #     # 段 0: 移至果树前方 5cm 悬停准备位，耗时 1500ms，到位后张开夹爪 (停顿 400ms)
      #     - { target: [0.20, 0.0, 0.25, 0.0], duration_ms: 1500, gripper: 1, dwell_ms: 400, linear: true }
      #     # 段 1: 探入 8cm 包裹果实，耗时 1000ms，到位后闭合夹紧 (停顿 600ms)
      #     - { target: [0.40, 0.0, 0.25, 0.0], duration_ms: 1000, gripper: 2, dwell_ms: 600, linear: true }
      #     # 段 2: 垂直向上提拉 6cm 脱离果柄，耗时 1000ms，保持夹紧；目标为途经点
      #     - { target: [0.40, 0.0, 0.40, 0.0], duration_ms: 1000, gripper: 0, dwell_ms: 0, linear: true, is_via_point: true }
      #     # 段 3: 带着果实收回到安全悬停高度，耗时 1500ms，保持夹紧
      #     - { target: [0.20, 0.0, 0.25, 0.0], duration_ms: 1500, gripper: 0, dwell_ms: 0, linear: true }

      zero:
        description: 机械臂基准零位姿 (大臂竖直朝天，小臂水平朝前)
        coordinate_frame: link_angles
        waypoints:

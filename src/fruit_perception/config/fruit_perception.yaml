left_camera:
  ros__parameters:
    video_device: "/dev/left_cam"
    framerate: 30.0
    io_method: "mmap"
    frame_id: "left_camera"
    pixel_format: "mjpeg2rgb"
    image_width: 1280
    image_height: 720
    camera_name: "left_camera"
    camera_info_url: "file:///home/rc4/fruit_ws/src/fruit_perception/config/left_camera_1280x720_calibration.yaml"
    brightness: 0
    contrast: 3
    saturation: 69
    sharpness: 2
    gain: 1
    auto_white_balance: false
    white_balance: 6500
    autoexposure: false
    exposure: 24

right_camera:
  ros__parameters:
    video_device: "/dev/right_cam"
    framerate: 30.0
    io_method: "mmap"
    frame_id: "right_camera"
    pixel_format: "mjpeg2rgb"
    image_width: 1280
    image_height: 720
    camera_name: "right_camera"
    camera_info_url: "file:///home/rc4/fruit_ws/src/fruit_perception/config/right_camera_1280x720_uncalibrated.yaml"
    brightness: 1
    contrast: 2
    saturation: 69
    sharpness: 2
    gain: 1
    auto_white_balance: false
    white_balance: 6500
    autoexposure: false
    exposure: 25

usb_camera_controls:
  ros__parameters:
    left_backlight_compensation: 125
    right_backlight_compensation: 121
    left_gamma: 84
    right_gamma: 84
    left_power_line_frequency: 1
    right_power_line_frequency: 1

d435i_camera:
  ros__parameters:
    serial_no: "243322073779"
    enable_color: true
    rgb_camera.color_profile: "1280x720x30"
    rgb_camera.color_format: "RGB8"
    rgb_camera.enable_auto_exposure: false
    rgb_camera.exposure: 639
    rgb_camera.gain: 0
    rgb_camera.enable_auto_white_balance: true
    rgb_camera.white_balance: 3610.0
    rgb_camera.brightness: 0
    rgb_camera.contrast: 62
    rgb_camera.saturation: 64
    rgb_camera.sharpness: 15
    rgb_camera.gamma: 274
    rgb_camera.backlight_compensation: false
    rgb_camera.power_line_frequency: 3
    enable_depth: true
    depth_module.depth_profile: "1280x720x30"
    depth_module.depth_format: "Z16"
    enable_sync: true
    align_depth.enable: true
    enable_rgbd: true
    enable_infra: false
    enable_infra1: false
    enable_infra2: false
    enable_gyro: false
    enable_accel: false
    pointcloud.enable: false
    publish_tf: false

fruit_perception_node:
  ros__parameters:
    enable_left_camera: true
    enable_right_camera: true
    enable_d435i: true
    left_input_topic: "/left_camera/image_raw"
    right_input_topic: "/right_camera/image_raw"
    d435i_rgbd_topic: "/camera/camera/rgbd"
    d435i_rgbd_heartbeat_topic: "/fruit_perception/d435i/rgbd_heartbeat"
    decision_topic: "/fruit_perception/decision"
    left_annotated_topic: "/fruit_perception/left/annotated_image"
    right_annotated_topic: "/fruit_perception/right/annotated_image"
    d435i_annotated_topic: "/fruit_perception/d435i/annotated_image"
    perception_mode_topic: "/fruit_mission/perception_mode"
    active_mode_topic: "/fruit_perception/active_mode"
    current_area_topic: "/fruit_mission/current_area"
    expected_fruit_type_topic: "/fruit_mission/expected_fruit_type"
    a_model_path: "/home/rc4/fruit_ws/src/fruit_perception/model/A.onnx"
    c_model_path: "/home/rc4/fruit_ws/src/fruit_perception/model/C.onnx"
    b_model_path: "/home/rc4/fruit_ws/src/fruit_perception/model/B.onnx"
    confidence_threshold: 0.50
    nms_iou_threshold: 0.45
    side_target_confidence_weight: 0.70
    side_target_score_close_threshold: 0.05
    side_target_acquisition_sec: 3.0
    side_target_association_iou_threshold: 0.30
    side_target_lock_miss_frames: 8
    d435i_target_confidence_weight: 0.70
    d435i_target_score_close_threshold: 0.05
    d435i_target_acquisition_frames: 35
    d435i_target_association_radius_m: 0.03
    d435i_target_outlier_sigma: 2.0
    d435i_target_lock_miss_frames: 8
    d435i_b_target_acquisition_frames: 50
    d435i_b_target_max_count: 2
    d435i_b_target_association_radius_m: 0.03
    d435i_b_target_outlier_sigma: 2.0

camera_mode_manager:
  ros__parameters:
    perception_mode_topic: "/fruit_mission/perception_mode"
    active_mode_topic: "/fruit_perception/active_mode"
    left_capture_service: "/left_camera/set_capture"
    right_capture_service: "/right_camera/set_capture"
    d435i_parameter_service: "/camera/camera/set_parameters"
    d435i_get_parameters_service: "/camera/camera/get_parameters"

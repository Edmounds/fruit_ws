camera:
  ros__parameters:
    serial_no: "243322073779"
    enable_color: true
    rgb_camera.color_profile: "1280x720x30"
    rgb_camera.color_format: "RGB8"
    rgb_camera.enable_auto_exposure: false
    rgb_camera.exposure: 639
    rgb_camera.gain: 0
    rgb_camera.enable_auto_white_balance: true
    rgb_camera.white_balance: 3610.0
    rgb_camera.brightness: 0
    rgb_camera.contrast: 62
    rgb_camera.saturation: 64
    rgb_camera.sharpness: 15
    rgb_camera.gamma: 274
    rgb_camera.backlight_compensation: false
    rgb_camera.power_line_frequency: 3
    enable_depth: true
    depth_module.depth_profile: "848x480x30"
    depth_module.depth_format: "Z16"
    depth_module.visual_preset: 3
    depth_module.enable_auto_exposure: false
    depth_module.exposure: 10589
    depth_module.gain: 16
    depth_module.emitter_enabled: 1
    depth_module.laser_power: 150.0
    spatial_filter.enable: true
    temporal_filter.enable: true
    enable_sync: true
    align_depth.enable: true
    enable_rgbd: true
    enable_infra: false
    enable_infra1: false
    enable_infra2: false
    enable_gyro: false
    enable_accel: false
    pointcloud.enable: false
    publish_tf: false

fruit_perception_node:
  ros__parameters:
    enable_camera: true
    camera_rgbd_topic: "/camera/rgbd"
    camera_rgbd_heartbeat_topic: "/fruit_perception/camera/rgbd_heartbeat"
    decision_topic: "/fruit_perception/decision"
    camera_annotated_topic: "/fruit_perception/camera/annotated_image"
    observation_window_topic: "/fruit_mission/observation_window"
    current_area_topic: "/fruit_mission/current_area"
    expected_fruit_type_topic: "/fruit_mission/expected_fruit_type"
    model_root: "/home/rc4/fruit_ws/src/fruit_perception/model"
    ripeness_model: "edge"
    performance_hint: "latency"
    confidence_threshold: 0.50
    nms_iou_threshold: 0.45
    camera_target_confidence_weight: 0.70
    camera_target_score_close_threshold: 0.05
    # Starting values, not measured calibration: confirm early in a rolling window.
    camera_target_acquisition_frames: 8
    camera_target_min_observations: 6
    camera_target_type_support_ratio: 0.75
    camera_target_max_missed_frames: 2
    camera_target_maturity_confidence_threshold: 0.70
    camera_target_association_radius_m: 0.03
    camera_target_outlier_sigma: 2.0
    camera_target_lock_miss_frames: 8
    camera_b_target_acquisition_frames: 8
    camera_b_target_max_count: 2
    camera_b_target_association_radius_m: 0.03
    camera_b_target_outlier_sigma: 2.0

fruit_perception_node:
  ros__parameters:
    enable_camera: true
    camera_rgbd_topic: /camera/rgbd
    camera_rgbd_heartbeat_topic: /fruit_perception/camera/rgbd_heartbeat
    decision_topic: /fruit_perception/decision
    camera_annotated_topic: /fruit_perception/camera/annotated_image
    preview_detections_topic: /fruit_perception/camera/preview_detections
    observation_window_topic: /fruit_mission/observation_window
    zone: A
    model_root: /home/rc4/fruit_ws/src/fruit_perception/model
    ripeness_model: edge
    performance_hint: latency
    confidence_threshold: 0.5
    nms_iou_threshold: 0.45
    camera_target_confidence_weight: 0.7
    camera_target_score_close_threshold: 0.05
    camera_target_acquisition_frames: 8
    camera_target_min_observations: 6
    camera_target_type_support_ratio: 0.75
    camera_target_max_missed_frames: 2
    camera_target_maturity_confidence_threshold: 0.7
    camera_target_association_radius_m: 0.03
    camera_target_outlier_sigma: 2.0
    camera_target_lock_miss_frames: 8
    camera_b_target_acquisition_frames: 8
    camera_b_target_association_radius_m: 0.03
    camera_b_target_outlier_sigma: 2.0

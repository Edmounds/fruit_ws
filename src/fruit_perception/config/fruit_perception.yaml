left_camera:
  ros__parameters:
    video_device: "/dev/left_cam"
    framerate: 30.0
    io_method: "mmap"
    frame_id: "left_camera"
    pixel_format: "mjpeg2rgb"
    image_width: 1280
    image_height: 720
    camera_name: "left_camera"
    camera_info_url: "file:///home/rc4/fruit_ws/src/fruit_perception/config/left_camera_1280x720_calibration.yaml"
    brightness: 0
    contrast: 3
    saturation: 69
    sharpness: 2
    gain: 1
    auto_white_balance: false
    white_balance: 5400
    autoexposure: false
    exposure: 25

right_camera:
  ros__parameters:
    video_device: "/dev/right_cam"
    framerate: 30.0
    io_method: "mmap"
    frame_id: "right_camera"
    pixel_format: "mjpeg2rgb"
    image_width: 1280
    image_height: 720
    camera_name: "right_camera"
    camera_info_url: "file:///home/rc4/fruit_ws/src/fruit_perception/config/right_camera_1280x720_uncalibrated.yaml"
    brightness: 0
    contrast: 3
    saturation: 69
    sharpness: 2
    gain: 1
    auto_white_balance: true
    white_balance: 4600
    autoexposure: false
    exposure: 25

usb_camera_controls:
  ros__parameters:
    left_backlight_compensation: 0
    right_backlight_compensation: 0

d435i_camera:
  ros__parameters:
    serial_no: "243322073779"
    enable_color: true
    rgb_camera.color_profile: "1280x720x30"
    rgb_camera.color_format: "RGB8"
    rgb_camera.enable_auto_exposure: false
    rgb_camera.exposure: 166
    rgb_camera.gain: 64
    rgb_camera.enable_auto_white_balance: false
    rgb_camera.white_balance: 4600.0
    enable_depth: true
    depth_module.depth_profile: "1280x720x30"
    depth_module.depth_format: "Z16"
    enable_sync: true
    align_depth.enable: true
    enable_rgbd: true
    enable_infra: false
    enable_infra1: false
    enable_infra2: false
    enable_gyro: false
    enable_accel: false
    pointcloud.enable: false
    publish_tf: false

fruit_perception_node:
  ros__parameters:
    enable_left_camera: true
    enable_right_camera: true
    enable_d435i: true
    left_input_topic: "/left_camera/image_raw"
    right_input_topic: "/right_camera/image_raw"
    d435i_rgbd_topic: "/camera/camera/rgbd"
    left_output_topic: "/fruit_perception/left/types"
    right_output_topic: "/fruit_perception/right/types"
    d435i_output_topic: "/fruit_perception/d435i/types"
    left_annotated_topic: "/fruit_perception/left/annotated_image"
    right_annotated_topic: "/fruit_perception/right/annotated_image"
    d435i_annotated_topic: "/fruit_perception/d435i/annotated_image"
    d435i_detections_topic: "/fruit_perception/d435i/detections"
    perception_mode_topic: "/fruit_mission/perception_mode"
    confidence_threshold: 0.50

camera_mode_manager:
  ros__parameters:
    perception_mode_topic: "/fruit_mission/perception_mode"
    active_mode_topic: "/fruit_perception/active_mode"
    left_capture_service: "/left_camera/set_capture"
    right_capture_service: "/right_camera/set_capture"
    d435i_parameter_service: "/camera/camera/set_parameters"

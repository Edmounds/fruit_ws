axis_waypoint_action_server:
  ros__parameters:
    # 坐标系配置
    map_frame: "odom"                   # 全局导航/里程计参考坐标系
    base_frame: "base_link"             # 机器人底盘中心坐标系

    # 控制与话题配置
    cmd_vel_topic: "/cmd_vel_nav"       # 导航底盘速度指令发布话题
    control_frequency: 20.0             # 控制循环频率 (Hz)

    # 速度与加速度限制
    max_linear_speed: 0.8               # 最大线速度 (m/s)
    min_linear_speed: 0.05              # 最小非零线速度 (m/s)，克服摩擦死区
    max_angular_speed: 1.4              # 最大角速度 (rad/s)
    min_angular_speed: 0.15              # 最小非零角速度 (rad/s，约 17.2°/s)
    max_linear_acceleration: 0.55        # 最大线加速度 (m/s²)，平滑加减速
    max_angular_acceleration: 1.7       # 最大角加速度 (rad/s²)，平滑旋转

    # 到点与容差配置
    forward_tolerance: 0.02             # 纵向到点容差 (m，即 1,5cm)，沿行进方向到位阈值
    lateral_tolerance: 0.042             # 横向偏差容差 (m，即 4cm)，垂直行进方向偏差阈值
    rotate_yaw_tolerance: 0.042          # 旋转角容差 (rad，约 3.44°)，目标朝向对齐阈值
    reverse_yaw_tolerance: 0.25         # 倒车航向偏角容差 (rad，约 14.3°)，在此偏角内允许倒车
    waypoint_pass_tolerance: 0.08       # 允许略过容差 (m，即 8cm)，卡滞恢复失败后仍可放行的距离

    # 控制增益与追踪参数
    linear_gain: 1.0                    # 线速度 P 增益 (速度随剩余距离缩放)
    yaw_gain: 2.0                       # 角速度 P 增益 (角速度随航向误差缩放)
    lookahead_distance: 0.26             # 前视预瞄距离 (m，即 30cm)，Pure Pursuit 追踪前视点

    # 异常检测与超时保护
    tf_timeout_sec: 1.0                 # TF 坐标查询超时时间 (秒)
    waypoint_retry_attempts: 0          # 异常重试次数 (0 为不重试直接判定)
    progress_window_sec: 1.0            # 进展监测滑动窗口时间 (秒)
    progress_position_threshold: 0.03   # 窗口期内最小位置位移 (m，3cm)，低于此值判定未前进
    progress_yaw_threshold: 0.01        # 窗口期内最小角度变化 (rad，0.57°)，低于此值判定未转动
    stall_timeout_sec: 5.0              # 持续卡滞超时阈值 (秒)


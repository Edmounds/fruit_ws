axis_waypoint_action_server:
  ros__parameters:
    map_frame: "odom"
    base_frame: "base_link"

    cmd_vel_topic: "/cmd_vel_nav"
    control_frequency: 20.0
    max_linear_speed: 0.6
    min_linear_speed: 0.05
    max_angular_speed: 1.0
    min_angular_speed: 0.3
    max_linear_acceleration: 0.8
    max_angular_acceleration: 2.0
    forward_tolerance: 0.02
    lateral_tolerance: 0.05
    rotate_yaw_tolerance: 0.06
    reverse_yaw_tolerance: 0.25
    linear_gain: 1.0
    yaw_gain: 2.0
    lookahead_distance: 0.3
    tf_timeout_sec: 0.5
    waypoint_retry_attempts: 0
    waypoint_pass_tolerance: 0.08
    progress_window_sec: 1.0
    progress_position_threshold: 0.03
    progress_yaw_threshold: 0.01
    stall_timeout_sec: 5.0

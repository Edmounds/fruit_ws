name: Build
on:
  pull_request:
  push:
    branches: [main]

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    container:
      image: rostooling/setup-ros-docker:ubuntu-jammy-ros-humble-desktop-latest
    steps:
      - name: Add LLVM APT repository
        uses: gerlero/add-apt-repository@v1
        with:
          uri: http://apt.llvm.org/jammy/
          suite: llvm-toolchain-jammy-21
          key: https://apt.llvm.org/llvm-snapshot.gpg.key

      - name: Install clang-format and clang-tidy
        uses: gerlero/apt-install@v1
        with:
          packages: clang-format-21 clang-tidy-21

      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install dependencies
        shell: bash
        run: |
          apt-get update
          rosdep update
          rosdep install -r --from-paths . --ignore-src --rosdistro humble -y

      - name: Build
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          colcon build --symlink-install --cmake-args -DCMAKE_BUILD_TYPE=Release

      - name: Test
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          source install/setup.bash
          colcon test --event-handlers console_direct+
          colcon test-result --verbose

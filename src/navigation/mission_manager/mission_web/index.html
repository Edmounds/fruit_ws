<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mission YAML 编辑器</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, "Noto Sans SC", "Microsoft YaHei", sans-serif;
      color: #20262d;
      background: #eef1f3;
      font-size: 14px;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; }
    button, select, input { font: inherit; }
    button, select, input {
      min-height: 34px;
      border: 1px solid #c5ccd1;
      border-radius: 4px;
      background: #fff;
      color: #20262d;
    }
    button { padding: 0 12px; cursor: pointer; font-weight: 600; }
    button:hover:not(:disabled) { border-color: #237a68; color: #176657; }
    button:focus-visible, select:focus-visible, input:focus-visible {
      outline: 2px solid #2b8a78;
      outline-offset: 1px;
    }
    button:disabled { opacity: .5; cursor: not-allowed; }
    .primary { color: #fff; background: #176b5c; border-color: #176b5c; }
    .primary:hover:not(:disabled) { color: #fff; background: #125849; }
    .app { min-height: 100vh; display: grid; grid-template-rows: auto minmax(0, 1fr); }
    .toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 58px;
      padding: 10px 16px;
      background: #fff;
      border-bottom: 1px solid #d6dce0;
      box-shadow: 0 1px 3px rgba(27, 38, 45, .06);
      z-index: 1;
    }
    .brand { font-size: 16px; font-weight: 750; margin-right: 8px; white-space: nowrap; }
    #mission-select { width: min(320px, 30vw); padding: 0 30px 0 9px; }
    .status { margin-left: auto; min-width: 0; text-align: right; }
    .current-file { font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .message { color: #68737c; font-size: 12px; min-height: 16px; }
    .message.error { color: #b33a2b; }
    .message.dirty { color: #a15b08; }
    .workspace {
      min-height: 0;
      padding: 12px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(410px, 42%);
      gap: 12px;
    }
    .plot-panel, .table-panel {
      min-width: 0;
      min-height: 0;
      background: #fff;
      border: 1px solid #d4dade;
      border-radius: 6px;
      overflow: hidden;
    }
    .plot-panel { display: grid; grid-template-rows: auto minmax(0, 1fr); }
    .plot-toolbar {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 48px;
      padding: 7px 10px;
      border-bottom: 1px solid #dbe0e3;
      background: #fafbfb;
    }
    .segmented { display: inline-flex; }
    .segmented button { border-radius: 0; margin-left: -1px; padding: 0 10px; }
    .segmented button:first-child { margin-left: 0; border-radius: 4px 0 0 4px; }
    .segmented button:last-child { border-radius: 0 4px 4px 0; }
    .segmented button[aria-pressed="true"] { color: #fff; background: #46545e; border-color: #46545e; z-index: 1; }
    #map-add-button.active { color: #fff; background: #176b5c; border-color: #176b5c; }
    .legend { display: flex; align-items: center; gap: 12px; margin-left: auto; color: #5e6971; font-size: 12px; }
    .legend-item { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
    .legend-dot { width: 10px; height: 10px; border-radius: 50%; border: 2px solid currentColor; background: #fff; }
    .legend-dot.waypoint { color: #2476a3; }
    .legend-dot.target { color: #d06a28; }
    .canvas-wrap { position: relative; min-height: 0; }
    #path-canvas { display: block; width: 100%; height: 100%; min-height: 370px; cursor: default; }
    #path-canvas.adding { cursor: crosshair; }
    .empty {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      color: #7a858d;
      pointer-events: none;
    }
    .empty[hidden] { display: none; }
    .table-panel { display: grid; grid-template-rows: auto minmax(0, 1fr); }
    .panel-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      padding: 12px 14px;
      border-bottom: 1px solid #dbe0e3;
    }
    .panel-header h1 { margin: 0; font-size: 15px; font-weight: 750; }
    #point-count { color: #6a757d; font-size: 12px; }
    .table-scroll { min-height: 0; overflow: auto; }
    table { width: 100%; border-collapse: collapse; table-layout: fixed; }
    th {
      position: sticky;
      top: 0;
      z-index: 1;
      padding: 8px 6px;
      background: #f4f6f7;
      border-bottom: 1px solid #d7dde1;
      color: #59646c;
      font-size: 12px;
      text-align: left;
    }
    td { padding: 6px; border-bottom: 1px solid #e5e9eb; vertical-align: middle; }
    tbody tr { cursor: pointer; }
    tbody tr:hover { background: #f4f9f7; }
    tbody tr.selected { background: #dcefe9; box-shadow: inset 3px 0 #17715f; }
    .index-col { width: 44px; text-align: center; }
    .type-col { width: 27%; }
    .number-col { width: 18%; }
    .actions-col { width: 94px; text-align: center; }
    td.type { overflow-wrap: anywhere; color: #48535b; }
    .point-type { display: inline-flex; align-items: center; gap: 6px; }
    .point-marker { width: 9px; height: 9px; flex: 0 0 auto; border-radius: 50%; background: #7b858c; }
    .point-marker.waypoint { background: #2476a3; }
    .point-marker.target { background: #d06a28; }
    td input { width: 100%; min-width: 0; height: 32px; padding: 4px 6px; font-family: "SFMono-Regular", Consolas, monospace; }
    td input.invalid { border-color: #bf3d2e; background: #fff5f3; }
    .row-actions { display: inline-flex; gap: 3px; }
    .icon-button { width: 27px; min-height: 27px; height: 27px; padding: 0; font-size: 16px; line-height: 1; }
    .delete-button:hover:not(:disabled) { color: #b33a2b; border-color: #b33a2b; }
    @media (max-width: 900px) {
      .toolbar { flex-wrap: wrap; }
      .brand { width: 100%; }
      #mission-select { width: min(100%, 360px); flex: 1 1 220px; }
      .status { width: 100%; text-align: left; margin-left: 0; }
      .workspace { grid-template-columns: 1fr; grid-template-rows: minmax(420px, 56vh) minmax(360px, 1fr); }
      .plot-toolbar { flex-wrap: wrap; }
    }
    @media (max-width: 560px) {
      .toolbar { padding: 10px; }
      .toolbar button { flex: 1 1 auto; }
      .workspace { padding: 8px; gap: 8px; }
      .legend { width: 100%; margin-left: 0; }
      .type-col { width: 26%; }
      .number-col { width: 18%; }
      th, td { padding-left: 4px; padding-right: 4px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="toolbar">
      <div class="brand">Mission YAML 编辑器</div>
      <select id="mission-select" aria-label="Mission YAML 文件"></select>
      <button id="refresh-button" type="button" title="刷新 Mission 文件列表">刷新列表</button>
      <button id="reload-button" type="button" title="从磁盘重新加载当前文件">重新加载</button>
      <button id="save-button" class="primary" type="button" title="保存为带时间戳的新文件">另存新文件</button>
      <div class="status">
        <div id="current-file" class="current-file">未选择文件</div>
        <div id="message" class="message" role="status" aria-live="polite"></div>
      </div>
    </header>

    <section class="workspace">
      <div id="plot-panel" class="plot-panel">
        <div class="plot-toolbar">
          <div class="segmented" aria-label="新增点类型">
            <button id="waypoint-mode-button" type="button" aria-pressed="true">途径点</button>
            <button id="target-mode-button" type="button" aria-pressed="false">目标点</button>
          </div>
          <button id="map-add-button" type="button">＋ 地图加点</button>
          <div class="legend" aria-label="点类型图例">
            <span class="legend-item"><span class="legend-dot waypoint"></span>途径点</span>
            <span class="legend-item"><span class="legend-dot target"></span>目标点</span>
          </div>
        </div>
        <div class="canvas-wrap">
          <canvas id="path-canvas" aria-label="Mission 路径坐标图"></canvas>
          <div id="plot-empty" class="empty">请选择 Mission YAML 文件</div>
        </div>
      </div>
      <section class="table-panel" aria-label="路径点编辑表格">
        <div class="panel-header">
          <h1>路径点</h1>
          <span id="point-count">0 个点</span>
        </div>
        <div class="table-scroll">
          <table>
            <thead>
              <tr>
                <th class="index-col">索引</th>
                <th class="type-col">类型</th>
                <th class="number-col">X</th>
                <th class="number-col">Y</th>
                <th class="number-col">Yaw</th>
                <th class="actions-col">操作</th>
              </tr>
            </thead>
            <tbody id="point-rows"></tbody>
          </table>
        </div>
      </section>
    </section>
  </main>

  <script src="/vendor/js-yaml.min.js"></script>
  <script src="/app.js"></script>
</body>
</html>

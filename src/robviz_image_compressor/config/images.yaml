robviz_image_compressor:
  ros__parameters:
    streams: ["color", "left", "right", "d435i_annotated", "left_annotated", "right_annotated"]

    streams.color.input_topic: "/camera/camera/color/image_raw"
    streams.color.output_base_topic: "/camera/camera/color/image_raw"
    streams.color.max_fps: 10.0
    streams.color.jpeg_quality: 70

    streams.left.input_topic: "/left_camera/image_raw"
    streams.left.output_base_topic: "/left_camera/image_raw"
    streams.left.max_fps: 10.0
    streams.left.jpeg_quality: 70

    streams.right.input_topic: "/right_camera/image_raw"
    streams.right.output_base_topic: "/right_camera/image_raw"
    streams.right.max_fps: 10.0
    streams.right.jpeg_quality: 70

    streams.d435i_annotated.input_topic: "/fruit_perception/d435i/annotated_image"
    streams.d435i_annotated.output_base_topic: "/fruit_perception/d435i/annotated_image"
    streams.d435i_annotated.max_fps: 10.0
    streams.d435i_annotated.jpeg_quality: 70

    streams.left_annotated.input_topic: "/fruit_perception/left/annotated_image"
    streams.left_annotated.output_base_topic: "/fruit_perception/left/annotated_image"
    streams.left_annotated.max_fps: 10.0
    streams.left_annotated.jpeg_quality: 70

    streams.right_annotated.input_topic: "/fruit_perception/right/annotated_image"
    streams.right_annotated.output_base_topic: "/fruit_perception/right/annotated_image"
    streams.right_annotated.max_fps: 10.0
    streams.right_annotated.jpeg_quality: 70

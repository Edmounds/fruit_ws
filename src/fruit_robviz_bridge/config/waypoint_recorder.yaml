fruit_waypoint_recorder:
  ros__parameters:
    frame_id: "odom"
    base_frame: "base_link"
    waypoint_file: "/home/rc4/fruit_ws/src/navigation/fruit_nav_bringup/waypoints/odom_waypoints.yaml"
    debug_waypoint_file: "/home/rc4/fruit_ws/src/navigation/fruit_nav_bringup/waypoints/debug_waypoints.yaml"
    template_file: "/home/rc4/fruit_ws/src/navigation/fruit_nav_bringup/waypoints/template.yaml"
    backup_dir: "/home/rc4/fruit_ws/tmp/waypoint_recorder_backups"

    sample_duration_sec: 1.0
    sample_period_sec: 0.05
    max_tf_age_sec: 1.5
    odometry_topic: "/odometry"
    standstill_linear_speed_mps: 0.03
    standstill_angular_speed_rps: 0.08
    standstill_confirm_duration_sec: 0.3
    standstill_timeout_sec: 5.0
    record_pose_max_translation_m: 0.05
    record_pose_max_yaw_rad: 0.10
    command_topic: "/fruit/waypoint_maker/command"
    state_topic: "/fruit/waypoint_maker/state"
    marker_topic: "/fruit/waypoint_maker/markers"
    follow_waypoints_action: "/follow_waypoints"
    axis_waypoint_node: "/axis_waypoint_action_server"
    default_final_yaw_mode: "blend_on_path"
    auto_name_prefix: ""
    auto_name_file: "/home/rc4/fruit_ws/src/navigation/fruit_nav_bringup/waypoints/template.yaml"
    source_root: "/home/rc4/fruit_ws/src"

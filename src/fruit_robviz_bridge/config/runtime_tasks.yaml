# Commands in this file are allowlisted local entry points.
# The browser can select task IDs, but cannot submit a command.
tasks:
  foxglove_bridge:
    readiness:
      tcp_port: 8765

  serial_controller:
    command: "ros2 launch auto_serial_bridge auto_serial_bridge.launch.py"
    readiness:
      ros_nodes:
        - /serial_controller
    log_file: serial_controller.log

  arm_planner_node:
    command: "ros2 launch fruit_arm_planner fruit_arm_planner.launch.py"
    dependencies:
      - serial_controller
    readiness:
      ros_nodes:
        - /arm_planner_node
      ros_services:
        - /arm_planner_node/move_cartesian
        - /arm_planner_node/move_joints
        - /arm_planner_node/execute_preset
        - /arm_planner_node/stop
    stop_command: "ros2 service call /arm_planner_node/stop std_srvs/srv/Trigger '{}'"
    log_file: arm_planner_node.log

  arm:
    dependencies:
      - foxglove_bridge
      - serial_controller
      - arm_planner_node

  perception:
    command: "/home/rc4/fruit_ws/start_fruit_perception.sh --zone A"
    readiness:
      process_pattern: "/home/rc4/fruit_ws/start_fruit_perception.sh"
    log_file: perception.log
    script: start_fruit_perception.sh
    parameters:
      zone: {flag: --zone, choices: [A, B, C], required: true}
      debug: {flag: --debug, default: false}
      ripeness_model: {flag: 'ripeness_model:=', choices: [edge, yolo], default: edge}
      performance_hint: {flag: 'performance_hint:=', choices: [latency, throughput], default: latency}
      perception_log_level: {flag: 'perception_log_level:=', choices: [debug, info, warn, error, fatal], default: warn}
      use_sim_time: {flag: 'use_sim_time:=', choices: ['true', 'false'], default: 'false'}

  navigation:
    command: "/home/rc4/fruit_ws/start_navigation.sh"
    readiness:
      process_pattern: "/home/rc4/fruit_ws/start_navigation.sh"
    log_file: navigation.log

  mission:
    command: "/home/rc4/fruit_ws/start_fruit_mission.sh"
    readiness:
      process_pattern: "--flow full --open-loop"
    log_file: mission.log
    script: start_fruit_mission.sh
    parameters:
      phase: {flag: --phase, choices: [all, prepare, localize], default: all}
      flow: {flag: --flow, choices: [full, ac, a, b, c], default: full}
      open_loop: {flag: --open-loop, choices: [A, C, AC, none], default: A}
      debug: {flag: --debug, default: false}

  mission_acb:
    command: "/home/rc4/fruit_ws/start_fruit_mission_acb.sh"
    readiness:
      process_pattern: "--flow acb --open-loop none"
    log_file: mission_acb.log
    script: start_fruit_mission_acb.sh
    note: 'ACB 固定：A 去程开环，A 回程及 C 闭环。定位阶段沿用准备参数。'
    parameters:
      phase: {flag: --phase, choices: [all, prepare, localize], default: all}
      debug: {flag: --debug, default: false}

  waypoint_recording:
    command: "/home/rc4/fruit_ws/waypoints_maker.sh"
    readiness:
      process_pattern: "/home/rc4/fruit_ws/waypoints_maker.sh"
    log_file: waypoint_recording.log
    script: waypoints_maker.sh
    note: '--tele 已默认启用，不需要传入。'
    parameters:
      debug: {flag: --debug, default: false}

  teleop:
    command: /home/rc4/fruit_ws/start_tele.sh
    readiness: {process_pattern: /home/rc4/fruit_ws/start_tele.sh}
    script: start_tele.sh
    parameters:
      debug: {flag: --debug, default: false}

  camera_arm_target:
    command: /home/rc4/fruit_ws/test_camera_arm_target.sh
    readiness: {process_pattern: /home/rc4/fruit_ws/test_camera_arm_target.sh}
    script: test_camera_arm_target.sh
    parameters:
      zone: {flag: --zone, choices: [A, B, C], required: true}
      side: {choices: [--left, --right], required: true}
      debug: {flag: --debug, default: false}

  voice_test:
    command: /home/rc4/fruit_ws/test_voice.sh
    script: test_voice.sh

  qr_test:
    command: /home/rc4/fruit_ws/test_qr.sh
    readiness: {process_pattern: /home/rc4/fruit_ws/test_qr.sh}
    script: test_qr.sh

joy_linux_node:
  ros__parameters:
    dev: "/dev/input/js0"
    dev_name: "Xbox Wireless Controller"
    dev_ff: ""
    deadzone: 0.2
    autorepeat_rate: 20.0
    default_trig_val: true

joy_convert_node:
  ros__parameters:
    # Xbox Series Bluetooth: RT=4 (GAS), LT=5 (BRAKE); 有线模式通常为 LT=2, RT=5
    rt_axis: 4
    lt_axis: 5
    angular_axis: 2
    ac_pick_left_button: 3
    ac_pick_right_button: 1
    return_initial_pose_button: 4
    linear_x_scale: 0.4
    angular_z_scale: 0.8
    trigger_dead_zone: 0.05
    dead_zone: 0.0

# mission 坐标换算使用；planner 仅接收基座系目标。所有平移单位为 mm。
# E: 夹爪抓取中心，局部 +X 前、+Y 左、+Z 上（随末端姿态旋转）。
# S: D435i 底部螺纹孔表面圆心；S 的轴与 E 同向。
# C: RGB 光学原点，+X 右、+Y 下、+Z 前。
# 用户确认 S 在 E 后方 75.413 mm、局部上方 66.726 mm（36.726 + 30）。
# E -> S = [-75.413, 0, +66.726] mm；反向 S -> E 的 Z 为负。
translation_end_to_screw_mm: [-75.413, 0.0, 66.726]

# 沿用 tmp/vison/Engineer/APPLICATION/camera_target_transform_config.h
# 的固定机身/光学数据；未在本次任务中独立验证其官方来源。
translation_screw_to_rgb_mm: [10.144894, 32.458360, 12.615321]
rotation_end_from_rgb:
  - [-0.00239767, 0.00237706, 0.99999400]
  - [-0.99999200, 0.00320883, -0.00240529]
  - [-0.00321453, -0.99999200, 0.00236935]

# 复用现有规划配置与限位参数，只读，不修改 planner。
arm_config_path: /home/rc4/fruit_ws/src/fruit_arm_planner/config/arm_presets.yaml
camera_frame: camera_color_optical_frame
joint_state_topic: /arm_planner_node/joint_states
move_cartesian_service: /arm_planner_node/move_cartesian
stop_service: /arm_planner_node/stop
endpoint_timeout_sec: 10.0
# 运动完成由 planner/下位机状态决定，不设置前端执行期限。

# mission 在目标末点闭爪，后续 Harvest/Home 由上位机调用预设。
motion:
  pitch_deg: 0.0  # A/C 抓取绝对俯仰角（度）；null 保持观测俯仰角
  pitch_b_up_deg: 0.0  # B 上层抓取绝对俯仰角（度）
  pitch_b_down_deg: -15.0  # B 下层抓取绝对俯仰角（度）；B 偏置仍按 0 度旋转，独立于抓取俯仰角
  pitch_d_up_deg: 0.0  # D 上层抓取绝对俯仰角（度）
  pitch_d_down_deg: 0.0  # D 下层抓取绝对俯仰角（度）
  duration_ms: 1500  # 1500ms 平滑探出抓取
  linear_path: false  # false: 关节空间 PTP 平滑规划
b_limits:
  x_min_m: -0.15  # 未叠加抓取偏置的 arm_base_link X 下限（米，含边界）
  x_max_m: 0.35   # X 上限；仅 B 区抓取候选生效，不隐藏检测预览
  min_m: -0.01
  split_m: 0.12
  max_m: 0.30
  max_distance_m: 0.65  # 未叠加抓取偏置的目标到机械臂基座原点的三维距离
d_limits:
  x_min_m: -0.15  # 未叠加抓取偏置的 arm_base_link X 下限（米，含边界）
  x_max_m: 0.35   # X 上限；仅 D 区抓取候选生效，不隐藏检测预览
  min_m: 0.15
  split_m: 0.32  # D区上/下层分割高度阈值（米）
  max_m: 0.45
  max_distance_m: 0.65  # 未叠加抓取偏置的目标到机械臂基座原点的三维距离
